# squares break detection (it came out as an 8x5 piece); located by hand.
grids = [ { corners = [[1170, 3249], [2075, 3249], [2075, 3783], [1170, 3783]], rows = 15, cols = 26 } ]
# No. 5. "(See adjoining page for Key Chart)": the clue page isn't in this
# 12-page scan, but archive.org has a second, 24-page scan of the same issue
# (item dated Nov 22; its masthead says Nov 29) whose page 23 is "Key Chart
# for Judge's Crossword Puzzle No. 5". That scan lacks the puzzle page.
clue_page = "sim_judge_1924-11-22_87/23"

# Dec 6, 1924: puzzle No. 6, two face-shaped grids, "Before Reading Judge"
# (1-41) and "—and After" (42-86), sharing one clue list ("Key to Judge's
# Crossword Puzzle No. 6") on the facing page. The detector read the paper
# around the faces and the hatched squares as white, so the numbering didn't
# fit the clues and the automatic pairing rejected them. The two grids are
# stacked here, separated by a row of blocks, which keeps the printed
# numbering. Transcribed from "Answer to Puzzle No. 6" under No. 7 in the
# 13 Dec issue (the answer-grid detector only found a piece of it).
[page."sim_judge_1924-12-06_87".34]
